name: ページ公開

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: Node.js セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: Pages 設定
        id: pages
        uses: actions/configure-pages@v6

      - name: ビルド
        run: npm run build -- --base="$PAGES_BASE_PATH/"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: 生成物のアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: デプロイ
        id: deploy
        uses: actions/deploy-pages@v5
